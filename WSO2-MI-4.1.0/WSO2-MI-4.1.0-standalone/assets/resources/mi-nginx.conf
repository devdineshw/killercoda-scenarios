# Define backend services
upstream sslapi.mi.wso2.com {
    server localhost:9743;
    ip_hash;
}

upstream health.mi.wso2.com {
    server localhost:9201;
    ip_hash;
}

upstream mgt.mi.wso2.com {
    server localhost:9164;
    ip_hash;
}

upstream sslgw.mi.wso2.com {
    server localhost:8253;
}

# Forward portal web UI requests
server {
    listen 80;
    server_name <WSO2_WEB_HOST>;
#### Following lines needs to be enabled when exposing backend services through nginx over SSL.
#### We are not using this feature for this playground
#   listen 443 ssl;
#   proxy_set_header X-Forwarded-Port 443;
#   ssl_certificate /etc/nginx/ssl/nginx.crt;
#   ssl_certificate_key /etc/nginx/ssl/nginx.key;
    location / {
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_read_timeout 5m;
            proxy_send_timeout 5m;
            proxy_pass https://sslapi.mi.wso2.com;
        }

        access_log /tmp/mi-access.log;
        error_log /tmp/mi-error.log;
}

